<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Users Viewer</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/GitHub_Invertocat_Black.svg">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto Mono', monospace;
            background-color: #0b0e14;
            min-height: 100vh;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;

            /* stars background */
            background-image:
                radial-gradient(1px 1px at 15% 20%, #ffffff55, transparent),
                radial-gradient(1px 1px at 40% 60%, #ffffff33, transparent),
                radial-gradient(1.5px 1.5px at 70% 15%, #ffffff44, transparent),
                radial-gradient(1px 1px at 85% 75%, #ffffff33, transparent),
                radial-gradient(1px 1px at 25% 85%, #ffffff22, transparent),
                radial-gradient(1.5px 1.5px at 55% 40%, #ffffff33, transparent),
                radial-gradient(1px 1px at 90% 30%, #ffffff44, transparent),
                radial-gradient(1px 1px at 10% 55%, #ffffff22, transparent),
                radial-gradient(1px 1px at 60% 90%, #ffffff33, transparent),
                radial-gradient(1.5px 1.5px at 33% 45%, #ffffff22, transparent);
            background-color: #0b0e14;
        }

        /* ------- HEADER ------- */
        .space-header {
            text-align: center;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 36px;
        }

        .space-header-top {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 10px;
        }

        /* GitHub logo SVG inline */
        .gh-logo {
            width: 46px;
            height: 46px;
            filter: brightness(0) saturate(100%) invert(72%) sepia(80%) saturate(400%) hue-rotate(155deg) brightness(105%) drop-shadow(0 0 8px #00d1ff88);
        }

        .space-header-top h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            font-weight: 900;
            color: #e0e6ff;
            letter-spacing: 2px;
        }

        .space-header-top h1 span {
            color: #00d1ff;
            text-shadow: 0 0 12px #00d1ff88;
        }

        .space-desc {
            color: #6b7a99;
            font-size: 0.82rem;
            letter-spacing: 1px;
            margin-top: 6px;
        }

        .space-line {
            border: 0;
            height: 1px;
            background: linear-gradient(to right, transparent, #00d1ff44, #7b61ff44, transparent);
            margin: 24px 0;
        }

        /* ------- LOADING BADGE ------- */
        .fetch-badge {
            background: transparent;
            border: 1px solid #00d1ff55;
            color: #00d1ff;
            padding: 10px 28px;
            border-radius: 6px;
            font-family: 'Roboto Mono', monospace;
            font-size: 0.85rem;
            letter-spacing: 2px;
            display: inline-block;
            margin-bottom: 28px;
            box-shadow: 0 0 16px #00d1ff22, inset 0 0 16px #00d1ff11;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.5; }
        }

        /* ------- GRID ------- */
        .profile-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 22px;
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
        }

        /* ------- CARD ------- */
        .profile-card {
            background: #12172a;
            padding: 28px 20px;
            border-radius: 14px;
            text-align: center;
            border: 1px solid #1e2a45;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        /* glowing top line */
        .profile-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 10%;
            width: 80%;
            height: 2px;
            background: linear-gradient(to right, #7b61ff, #00d1ff);
            border-radius: 0 0 4px 4px;
        }

        .profile-card:hover {
            transform: translateY(-6px);
            border-color: #00d1ff44;
            box-shadow: 0 0 24px #00d1ff22, 0 8px 30px rgba(0, 0, 0, 0.4);
        }

        .profile-card img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-bottom: 14px;
            border: 2px solid #7b61ff;
            box-shadow: 0 0 12px #7b61ff55;
        }

        .profile-card p {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.78rem;
            font-weight: 600;
            color: #c8d6f5;
            margin: 0 0 14px;
            letter-spacing: 1px;
        }

        .profile-card a {
            text-decoration: none;
            color: #00d1ff;
            font-size: 0.75rem;
            font-family: 'Roboto Mono', monospace;
            letter-spacing: 1px;
            border: 1px solid #00d1ff55;
            padding: 6px 16px;
            border-radius: 4px;
            transition: background 0.2s, color 0.2s, box-shadow 0.2s;
        }

        .profile-card a:hover {
            background: #00d1ff18;
            color: #fff;
            box-shadow: 0 0 10px #00d1ff44;
        }
    </style>
</head>

<body>

    <header class="space-header">
        <div class="space-header-top">

            <!-- GitHub logo from uploaded file -->
            <img src="assets/images/GitHub_Invertocat_Black.svg" class="gh-logo" alt="GitHub Logo" />

            <h1>GitHub Users <span>Viewer</span></h1>
        </div>
        <p class="space-desc">// FETCH DATA FROM THE GITHUB API AND DISPLAY USERS DYNAMICALLY</p>
        <hr class="space-line">
    </header>

    <div id="fetchStatus" class="fetch-badge">[ LOADING USERS... ]</div>
    <div id="profileGrid" class="profile-grid"></div>

    <script>
        var profileGrid = document.getElementById('profileGrid');
        var fetchStatus = document.getElementById('fetchStatus');

        fetch('https://api.github.com/users')
            .then(function (res) {
                return res.json();
            })
            .then(function (users) {
                fetchStatus.style.display = 'none';

                users.slice(0, 10).forEach(function (user) {
                    var card = document.createElement('div');
                    card.classList.add('profile-card');
                    card.innerHTML =
                        '<img src="' + user.avatar_url + '" />' +
                        '<p>' + user.login + '</p>' +
                        '<a href="' + user.html_url + '" target="_blank">View Profile</a>';

                    profileGrid.appendChild(card);
                });
            })
            .catch(function (err) {
                fetchStatus.innerText = '[ FAILED TO LOAD USERS ]';
                console.error(err);
            });
    </script>

</body>

</html>
